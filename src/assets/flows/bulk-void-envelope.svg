  <title id="bulk-void-envelope-title">Bulk Void Envelope user flow</title>
  <desc id="bulk-void-envelope-desc">Swimlane user flow: a sender selects several envelopes and confirms a void with a reason, the system checks permissions and status then voids each eligible envelope, the sender reviews per-envelope results, and recipients receive a void notice by email.</desc>
