<svg viewBox="8 64 1148 464" width="1148" height="464" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="recipient-2fa-title recipient-2fa-desc">
  <title id="recipient-2fa-title">Recipient 2FA user flow</title>
  <desc id="recipient-2fa-desc">Swimlane user flow: a recipient opens the document link, the system requires two-factor authentication and sends a one-time code, the recipient enters it, and the system either lets them sign or lets them request a new code after a wrong attempt.</desc>
