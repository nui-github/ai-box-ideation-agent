<svg viewBox="0 0 1280 720" width="1280" height="720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="envelope-reminder-title envelope-reminder-desc">
  <title id="envelope-reminder-title">Envelope reminder user flow</title>
  <desc id="envelope-reminder-desc">Swimlane user flow: a sender sets a reminder rule, the system checks pending envelopes near expiry and emails the recipient, repeating until the recipient signs, then stops reminding and updates the sender.</desc>
