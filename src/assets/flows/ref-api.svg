<svg viewBox="0 0 1280 688" width="1280" height="688" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ref-api-title ref-api-desc">
  <title id="ref-api-title">API Endpoints overview</title>
  <desc id="ref-api-desc">Architecture overview: the app calls three API groups: document management, sharing, and template and E-Form, with the document group highlighted as the core.</desc>
  <defs>
    <marker id="ref-api-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="ref-api-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0463EF"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <line x1="280" y1="122" x2="380" y2="122" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ref-api-arrow)"/>
  <line x1="280" y1="294" x2="380" y2="294" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ref-api-arrow)"/>
  <line x1="280" y1="466" x2="380" y2="466" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ref-api-arrow)"/>
  <rect x="40" y="48" width="240" height="492" rx="6" fill="#f5f5f5"/>
  <rect x="40" y="48" width="240" height="492" rx="6" fill="#ffffff" stroke="#010136" stroke-width="1"/>
  <text x="60" y="76" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CLIENT</text>
  <text x="160" y="292" fill="#010136" font-size="12" font-family="'Geist', 'IBM Plex Sans Thai', sans-serif" font-weight="600" text-anchor="middle">แอป eSignature</text>
  <text x="160" y="308" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">request → API</text>
  <rect x="380" y="48" width="860" height="148" rx="6" fill="#f5f5f5"/>
  <rect x="380" y="48" width="860" height="148" rx="6" fill="rgba(4,99,239,0.08)" stroke="#0463EF" stroke-width="1"/>
  <line x1="760" y1="64" x2="760" y2="180" stroke="rgba(1,1,54,0.10)" stroke-width="1"/>
  <text x="400" y="76" fill="#0463EF" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">API GROUP · 01</text>
  <text x="400" y="100" fill="#010136" font-size="14" font-family="'Geist', 'IBM Plex Sans Thai', sans-serif" font-weight="600">ระบบจัดการเอกสาร (eSignature)</text>
  <text x="400" y="128" fill="#010136" font-size="10" font-family="'Geist Mono', monospace">/eSignature/save</text>
  <text x="400" y="146" fill="#010136" font-size="10" font-family="'Geist Mono', monospace">/search · /getByTracking</text>
  <text x="400" y="164" fill="#010136" font-size="10" font-family="'Geist Mono', monospace">/download · /void · /delete</text>
  <circle cx="784" cy="80" r="2" fill="#4f5d75"/>
  <text x="796" y="84" fill="#010136" font-size="12" font-family="'Geist', 'IBM Plex Sans Thai', sans-serif">บันทึกร่าง / ส่งเอกสารให้ผู้ที่เกี่ยวข้องเซ็น</text>
  <circle cx="784" cy="100" r="2" fill="#4f5d75"/>
  <text x="796" y="104" fill="#010136" font-size="12" font-family="'Geist', 'IBM Plex Sans Thai', sans-serif">ค้นหาเอกสาร และตรวจสถานะล่าสุด</text>
  <circle cx="784" cy="120" r="2" fill="#4f5d75"/>
  <text x="796" y="124" fill="#010136" font-size="12" font-family="'Geist', 'IBM Plex Sans Thai', sans-serif">ดาวน์โหลดไฟล์ที่จัดการเสร็จสมบูรณ์</text>
  <circle cx="784" cy="140" r="2" fill="#4f5d75"/>
  <text x="796" y="144" fill="#010136" font-size="12" font-family="'Geist', 'IBM Plex Sans Thai', sans-serif">ยกเลิกเอกสารที่ส่งแล้ว หรือลบออกจากระบบ</text>
  <circle cx="784" cy="160" r="2" fill="#4f5d75"/>
  <text x="796" y="164" fill="#010136" font-size="12" font-family="'Geist', 'IBM Plex Sans Thai', sans-serif">ส่งอีเมลแจ้งซ้ำไปเตือนผู้เซ็น</text>
  <rect x="380" y="220" width="860" height="148" rx="6" fill="#f5f5f5"/>
  <rect x="380" y="220" width="860" height="148" rx="6" fill="#ffffff" stroke="#010136" stroke-width="1"/>
  <line x1="760" y1="236" x2="760" y2="352" stroke="rgba(1,1,54,0.10)" stroke-width="1"/>
  <text x="400" y="248" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">API GROUP · 02</text>
  <text x="400" y="272" fill="#010136" font-size="14" font-family="'Geist', 'IBM Plex Sans Thai', sans-serif" font-weight="600">ระบบแชร์ข้อมูล (Sharing)</text>
  <text x="400" y="300" fill="#010136" font-size="10" font-family="'Geist Mono', monospace">/sharing/owner/esignature/get</text>
  <circle cx="784" cy="252" r="2" fill="#4f5d75"/>
  <text x="796" y="256" fill="#010136" font-size="12" font-family="'Geist', 'IBM Plex Sans Thai', sans-serif">เจ้าของ: กำหนดสิทธิ์ · สร้างลิงก์ · แก้ไข/ลบการแชร์</text>
  <circle cx="784" cy="272" r="2" fill="#4f5d75"/>
  <text x="796" y="276" fill="#010136" font-size="12" font-family="'Geist', 'IBM Plex Sans Thai', sans-serif">สมาชิก: เข้าถึงตามสิทธิ์ที่ได้รับ</text>
  <circle cx="784" cy="292" r="2" fill="#4f5d75"/>
  <text x="796" y="296" fill="#010136" font-size="12" font-family="'Geist', 'IBM Plex Sans Thai', sans-serif">สมาชิก: ดูข้อมูลที่แชร์มา · รับอีเมลแจ้งเตือน</text>
  <rect x="380" y="392" width="860" height="148" rx="6" fill="#f5f5f5"/>
  <rect x="380" y="392" width="860" height="148" rx="6" fill="#ffffff" stroke="#010136" stroke-width="1"/>
  <line x1="760" y1="408" x2="760" y2="524" stroke="rgba(1,1,54,0.10)" stroke-width="1"/>
  <text x="400" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">API GROUP · 03</text>
  <text x="400" y="444" fill="#010136" font-size="14" font-family="'Geist', 'IBM Plex Sans Thai', sans-serif" font-weight="600">ระบบแม่แบบ (Template &amp; E-Form)</text>
  <text x="400" y="472" fill="#5a6580" font-size="12" font-family="'Geist', 'IBM Plex Sans Thai', sans-serif">ยังไม่มี endpoint ระบุในข้อมูลอ้างอิง</text>
  <circle cx="784" cy="424" r="2" fill="#4f5d75"/>
  <text x="796" y="428" fill="#010136" font-size="12" font-family="'Geist', 'IBM Plex Sans Thai', sans-serif">Template: บันทึกโครงสร้างเอกสารไว้ใช้ซ้ำ</text>
  <circle cx="784" cy="444" r="2" fill="#4f5d75"/>
  <text x="796" y="448" fill="#010136" font-size="12" font-family="'Geist', 'IBM Plex Sans Thai', sans-serif">E-Form: สร้างแบบฟอร์มออนไลน์</text>
  <circle cx="784" cy="464" r="2" fill="#4f5d75"/>
  <text x="796" y="468" fill="#010136" font-size="12" font-family="'Geist', 'IBM Plex Sans Thai', sans-serif">ผู้รับกดลิงก์เพื่อกรอกข้อมูลเองได้โดยตรง</text>
  <line x1="40" y1="568" x2="1240" y2="568" stroke="rgba(1,1,54,0.10)" stroke-width="0.8"/>
  <text x="40" y="592" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
  <rect x="40" y="612" width="14" height="10" rx="2" fill="#ffffff" stroke="#010136" stroke-width="1"/>
  <text x="60" y="621" fill="#4f5d75" font-size="12" font-family="'Geist', 'IBM Plex Sans Thai', sans-serif">กลุ่ม API</text>
  <rect x="140" y="612" width="14" height="10" rx="2" fill="rgba(4,99,239,0.08)" stroke="#0463EF" stroke-width="1"/>
  <text x="160" y="621" fill="#4f5d75" font-size="12" font-family="'Geist', 'IBM Plex Sans Thai', sans-serif">กลุ่มหลักที่ flow ส่วนใหญ่ใช้</text>
  <line x1="340" y1="617" x2="368" y2="617" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ref-api-arrow)"/>
  <text x="376" y="621" fill="#4f5d75" font-size="12" font-family="'Geist', 'IBM Plex Sans Thai', sans-serif">เรียกใช้</text>
</svg>
