    <marker id="export-report-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="export-report-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0463EF"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <line x1="40" y1="96" x2="1240" y2="96" stroke="rgba(1,1,54,0.22)" stroke-width="1"/>
  <line x1="40" y1="256" x2="1240" y2="256" stroke="rgba(1,1,54,0.10)" stroke-width="1"/>
