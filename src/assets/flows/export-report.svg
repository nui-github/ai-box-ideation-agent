<svg viewBox="0 0 1280 560" width="1280" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="export-report-title export-report-desc">
  <title id="export-report-title">Export Report user flow</title>
  <desc id="export-report-desc">Swimlane user flow: an admin picks a monthly report and file format, the system gathers usage statistics and builds the file, and the admin downloads it, or receives an emailed link when the file is large.</desc>
