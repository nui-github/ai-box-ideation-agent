<svg viewBox="0 0 1280 720" width="1280" height="720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="realtime-dashboard-title realtime-dashboard-desc">
  <title id="realtime-dashboard-title">Real-time Dashboard user flow</title>
  <desc id="realtime-dashboard-desc">Swimlane user flow: a viewer opens the company dashboard, the system loads status totals, and the numbers update on their own when a signer changes an envelope&#x27;s status.</desc>
